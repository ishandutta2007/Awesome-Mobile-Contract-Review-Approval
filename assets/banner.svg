<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #cbd5e1;
    }
    
    /* Subtle animations that do NOT obstruct foreground text */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes floatPhone {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -40; }
    }
    @keyframes checkPop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .pulse-bg {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 960px 210px;
    }
    .floating-device {
      animation: floatPhone 5s ease-in-out infinite;
    }
    .dashed-flow {
      stroke-dasharray: 6 6;
      animation: dashTravel 2s linear infinite;
    }
    .status-check {
      animation: checkPop 4s ease-in-out infinite;
      transform-origin: 1045px 145px;
    }
  </style>

  <!-- Deep Slate Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.35">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Ambient Glow in illustration region (kept far right behind graphic) -->
  <circle cx="960" cy="210" r="160" fill="url(#accentGlow)" class="pulse-bg" filter="url(#softGlow)" />
  <circle cx="200" cy="100" r="120" fill="#38bdf8" opacity="0.06" filter="url(#softGlow)" />

  <!-- ==================== RIGHT SIDE: MOBILE & CONTRACT WORKFLOW GRAPHIC ==================== -->
  <g class="floating-device">
    <!-- Connecting Workflow Circuit Lines -->
    <path d="M 770 190 C 810 190, 830 220, 860 220" fill="none" stroke="#6366f1" stroke-width="2" class="dashed-flow" opacity="0.7" />
    <path d="M 1060 220 C 1090 220, 1100 180, 1120 180" fill="none" stroke="#38bdf8" stroke-width="2" class="dashed-flow" opacity="0.7" />

    <!-- Mobile Device Silhouette -->
    <rect x="880" y="70" width="170" height="280" rx="28" fill="#0f172a" stroke="#334155" stroke-width="3" filter="url(#glow)" />
    <!-- Screen -->
    <rect x="890" y="85" width="150" height="250" rx="18" fill="#1e293b" />
    <!-- Speaker & Camera notch -->
    <rect x="945" y="93" width="40" height="4" rx="2" fill="#475569" />
    
    <!-- Mini Document Card inside Mobile -->
    <rect x="902" y="115" width="126" height="150" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <!-- Document Header lines -->
    <rect x="912" y="127" width="55" height="6" rx="3" fill="#38bdf8" />
    <rect x="912" y="140" width="106" height="4" rx="2" fill="#64748b" opacity="0.7" />
    <rect x="912" y="150" width="95" height="4" rx="2" fill="#64748b" opacity="0.7" />
    <!-- Redline highlights inside Doc -->
    <rect x="912" y="162" width="70" height="5" rx="2.5" fill="#f43f5e" opacity="0.85" />
    <rect x="912" y="173" width="100" height="4" rx="2" fill="#64748b" opacity="0.7" />
    <!-- Clause approval card inside Doc -->
    <rect x="912" y="188" width="106" height="32" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="920" y="202" font-family="sans-serif" font-size="8" font-weight="bold" fill="#10b981">CLAUSE APPROVED</text>
    <path d="M 920 212 L 950 212" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Mobile Action Button: "Sign & Approve" -->
    <rect x="906" y="278" width="118" height="28" rx="8" fill="url(#primaryGrad)" />
    <text x="930" y="296" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">APPROVE ✍️</text>

    <!-- Floating Badge 1: Instant Redline -->
    <g transform="translate(760, 110)">
      <rect width="130" height="44" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="22" r="8" fill="#f43f5e" opacity="0.2" />
      <text x="16" y="26" font-family="sans-serif" font-size="12" fill="#f43f5e">⚡</text>
      <text x="35" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f1f5f9">AI Redlining</text>
      <text x="35" y="33" font-family="sans-serif" font-size="9" fill="#94a3b8">Active compare</text>
    </g>

    <!-- Floating Badge 2: Verified Signature with Checkmark Animation -->
    <g class="status-check" transform="translate(1015, 125)">
      <rect width="125" height="42" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="21" r="9" fill="#10b981" opacity="0.2" />
      <text x="14" y="26" font-family="sans-serif" font-size="13" fill="#10b981">✓</text>
      <text x="35" y="19" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f1f5f9">e-Signature</text>
      <text x="35" y="32" font-family="sans-serif" font-size="9" fill="#10b981">Audit Trail PAdES</text>
    </g>

    <!-- Floating Badge 3: Multi-tier CLM -->
    <g transform="translate(780, 275)">
      <rect width="115" height="42" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="18" cy="21" r="8" fill="#818cf8" opacity="0.2" />
      <text x="12" y="26" font-family="sans-serif" font-size="12" fill="#818cf8">📱</text>
      <text x="32" y="19" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f1f5f9">Mobile CLM</text>
      <text x="32" y="32" font-family="sans-serif" font-size="9" fill="#94a3b8">iOS &amp; Android</text>
    </g>
  </g>

  <!-- ==================== LEFT SIDE: HERO CONTENT (CLEAN & UNCLUTTERED) ==================== -->
  
  <!-- Category Pill Tag -->
  <g transform="translate(60, 60)">
    <rect width="265" height="30" rx="15" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="15" cy="15" r="4" fill="#38bdf8" />
    <text x="28" y="20" class="badge-label">Curated LegalTech Stack</text>
  </g>

  <!-- Main Headline with Gradient Accent -->
  <g transform="translate(60, 135)">
    <text class="title-text" fill="#f8fafc">Awesome Mobile Contract</text>
    <text y="50" class="title-text" fill="url(#primaryGrad)">Review &amp; Approval</text>
  </g>

  <!-- Subtitle / Value Proposition -->
  <text x="60" y="235" class="subtitle-text">
    A curated index of top SaaS &amp; Open-Source Contract Lifecycle Management (CLM),
  </text>
  <text x="60" y="262" class="subtitle-text">
    mobile negotiation, redlining, and digital signature workflow platforms.
  </text>

  <!-- Feature Highlights / Tag Pills -->
  <g transform="translate(60, 310)">
    <!-- Pill 1: E-Signatures -->
    <rect x="0" y="0" width="125" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="18" y="22" class="pill-text">✍️ E-Signatures</text>

    <!-- Pill 2: AI Redline -->
    <rect x="135" y="0" width="125" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="150" y="22" class="pill-text">⚡ AI Redlining</text>

    <!-- Pill 3: Mobile Approval -->
    <rect x="270" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="285" y="22" class="pill-text">📱 Mobile Workflow</text>

    <!-- Pill 4: Open-Source -->
    <rect x="425" y="0" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="440" y="22" class="pill-text">🛡️ Open-Source CLM</text>
  </g>
</svg>